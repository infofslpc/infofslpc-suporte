  <div class="container">
    <header>
      <!-- Logo flutuante substituída -->
      <div class="logo-animada">
        <img src="logo.png" alt="Logo Infofsl Informática" class="logo-img">
      </div>
      <h1>Central de Suporte · Downloads</h1> <!-- (Nota: No office.html e windows.html mantenha os títulos respetivos) -->

    <div class="accordion-group">
      <!-- Botão para página do Windows -->
      <a href="windows.html" class="download-btn menu-principal">

          <div class="summary-content">
